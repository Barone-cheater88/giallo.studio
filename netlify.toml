[build]
  # Base directory: Netlify cambierà directory qui prima di eseguire i comandi
  base = "web"
  # Comando di build: installa dipendenze e builda Next.js in HTML statico
  command = "npm install && npm run build"
  # Cartella generata da `output: 'export'`. Nessun plugin Next: zero funzioni serverless.
  publish = "out"

[build.environment]
  # Impedisce a Netlify di riattaccare il runtime Next.js, che rimetterebbe le funzioni.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-DNS-Prefetch-Control = "on"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
